name: TIAToolbox Docker Build

on:
  push:
    paths:
      - "docker/tiatoolbox-dev/**"
      - ".github/workflows/tiatoolbox_dev_docker.yml"

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout GitHub Action
        uses: actions/checkout@v3

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: metadata
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/tiatoolbox
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}} 
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=sha
            type=raw,value=latest

      - name: Build and push multi-arch images
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./docker/tiatoolbox-dev/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}/tiatoolbox:buildcache
          cache-to: type=inline